# Generate PokeWatch.xcodeproj with:  Scripts/generate.sh   (XcodeGen 2.44+)
name: PokeWatch
options:
  bundleIdPrefix: ng.khuo
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  # The iPhone app: settings, the full Pokédex, face previews, and sprite packs for the watch.
  # It carries the watch app in Watch/; archive this target to ship both.
  PokeWatchPhone:
    type: application
    platform: iOS
    sources:
      - PokeWatch/Phone
      - PokeWatch/Characters
      - PokeWatch/Resources/Sprites
      - PokeWatch/Components
      - PokeWatch/Core/Animation
      - PokeWatch/Core/Clock
      - PokeWatch/Core/Sync
      - PokeWatch/Core/Persistence
      - PokeWatch/Core/Battery/BatterySnapshot.swift
      - PokeWatch/Core/Health/ActivitySnapshot.swift
      - path: PokeWatch/WatchFaces
        excludes: ["FaceHost.swift"]
      # Full sprite set (shiny, full-rate Modern), imported at build time; never committed.
      - path: PokeWatch/Resources/Phone/ImportedSprites
        type: folder
        optional: true
        buildPhase: resources
      - path: PokeWatch/Resources/Phone/ImportedStills
        type: folder
        optional: true
        buildPhase: resources
    info:
      path: PokeWatch/Phone/Info.plist
      properties:
        CFBundleDisplayName: PokéWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ng.khuo.pokewatch
        PRODUCT_NAME: PokeWatch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PokeWatch AppStore
    dependencies:
      - target: PokeWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  # Screenshots on the iPhone Duo (front and unfolded, portrait and landscape); run in CI.
  PokeWatchPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PokeWatch/PhoneUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ng.khuo.pokewatch.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PokeWatchPhone
    dependencies:
      - target: PokeWatchPhone

  PokeWatch:
    type: application
    platform: watchOS
    sources:
      - path: PokeWatch
        excludes:
          - "Widgets/**"
          - "Tests/**"
          - "Resources/ImportedSprites/**"
          - "Resources/ImportedStills/**"
          - "Resources/Phone/**"
          - "Phone/**"
          - "PhoneUITests/**"
          - "**/*.md"
      # Game sprites imported at build time by Scripts/import_sprites.py (never committed).
      - path: PokeWatch/Resources/ImportedSprites
        type: folder
        optional: true
        buildPhase: resources
    info:
      path: PokeWatch/App/Info.plist
      properties:
        CFBundleDisplayName: PokéWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # Companion of the iPhone app, but runs on its own without it.
        WKCompanionAppBundleIdentifier: ng.khuo.pokewatch
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        WKSupportsAlwaysOnDisplay: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSHealthShareUsageDescription: PokéWatch reads today's steps, active energy, exercise minutes and activity rings so your Pokémon can react to them. Heart rate is read only if you turn it on. Nothing leaves your watch.
        NSHealthUpdateUsageDescription: PokéWatch never writes to Health. It only reads the activity data described above.
        CFBundleURLTypes:
          - CFBundleURLName: ng.khuo.pokewatch
            CFBundleURLSchemes: [pokewatch]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: PokeWatch/App/PokeWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ng.khuo.pokewatch.watchkitapp
        PRODUCT_NAME: PokeWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PokeWatch Watch AppStore
    dependencies:
      - target: PokeWatchWidgets
        embed: true
      - sdk: HealthKit.framework
      - sdk: WidgetKit.framework

  PokeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - PokeWatch/Widgets
      - PokeWatch/Characters
      - PokeWatch/Resources/Sprites
      - path: PokeWatch/Resources/ImportedStills
        type: folder
        optional: true
        buildPhase: resources
      - PokeWatch/Core/Battery/BatterySnapshot.swift
      - PokeWatch/Core/Health/ActivitySnapshot.swift
      - PokeWatch/Core/Health/HealthQueries.swift
      - PokeWatch/Components/Color+Hex.swift
      - PokeWatch/Components/SpriteImage.swift
      - PokeWatch/Components/PokeballBattery.swift
    info:
      path: PokeWatch/Widgets/Info.plist
      properties:
        CFBundleDisplayName: PokéWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: PokéWatch complications read today's step count to show progress. Nothing leaves your watch.
        NSHealthUpdateUsageDescription: PokéWatch never writes to Health. It only reads the activity data described above.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PokeWatch/Widgets/PokeWatchWidgets.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ng.khuo.pokewatch.watchkitapp.widgets
        PRODUCT_NAME: PokeWatchWidgets
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PokeWatch Widgets AppStore
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  PokeWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - PokeWatch/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ng.khuo.pokewatch.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PokeWatch.app/PokeWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PokeWatch

schemes:
  PokeWatch:
    build:
      targets:
        PokeWatch: all
        PokeWatchTests: [test]
    test:
      targets:
        - PokeWatchTests
      gatherCoverageData: true
    run:
      config: Debug
  PokeWatchWidgets:
    build:
      targets:
        PokeWatchWidgets: all
        PokeWatch: all
    run:
      config: Debug
  # Archive scheme for App Store / TestFlight (destination generic/platform=iOS).
  PokeWatchPhone:
    build:
      targets:
        PokeWatchPhone: all
        PokeWatchPhoneUITests: [test]
    test:
      targets:
        - PokeWatchPhoneUITests
    run:
      config: Debug
    archive:
      config: Release
