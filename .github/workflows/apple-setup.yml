name: Apple setup

# Safe to run again: registers ng.khuo.pokewatch and ng.khuo.pokewatch.widgets with HealthKit and makes their
# App Store profiles. They come back as an artifact; store them as DIST_PROFILE_BASE64 and
# DIST_PROFILE_WIDGETS_BASE64.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-24.04
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Read the distribution certificate's serial
        env:
          P12: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          serial=$( (openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -clcerts -passin env:P12_PASS -legacy 2>/dev/null \
                     || openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -clcerts -passin env:P12_PASS) \
                   | openssl x509 -noout -serial | cut -d= -f2)
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "DIST_CERT_SERIAL=$serial" >> "$GITHUB_ENV"
      - run: bundle exec fastlane setup
      - uses: actions/upload-artifact@v4
        with:
          name: pokewatch-profiles
          path: build/*.mobileprovision
          if-no-files-found: error
          retention-days: 1
