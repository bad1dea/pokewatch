name: TestFlight

# Run by hand from the Actions tab. Builds with Xcode 27 so the app links against the watchOS 27 SDK.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -switch "$xc"
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch
      - run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install the certificate and profiles
        env:
          P12: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.DIST_PROFILE_BASE64 }}
          PROFILE_WATCH: ${{ secrets.DIST_PROFILE_WATCH_BASE64 }}
          PROFILE_WIDGETS: ${{ secrets.DIST_PROFILE_WIDGETS_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPASS="$(openssl rand -hex 12)"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          # The login keychain stays in the list so Apple's intermediate certificates resolve.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[",]//g')
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          for P in "$PROFILE" "$PROFILE_WATCH" "$PROFILE_WIDGETS"; do
            UUID="$(echo "$P" | base64 --decode | security cms -D 2>/dev/null | plutil -extract UUID raw -)"
            echo "$P" | base64 --decode > "$PROFILES/$UUID.mobileprovision"
            echo "installed profile $UUID"
          done

      - name: Build and upload
        run: bundle exec fastlane beta
